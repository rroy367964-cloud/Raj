name: Build APK and Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating temporary debug keystore..."
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK build output
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk not found at expected path."
            exit 1
          fi
          echo "Verified APK exists at app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          TITLE="Release v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Publishing release with tag: $TAG"
          gh release create "$TAG" "$APK_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Automated debug APK build for commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          TITLE="Release v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_FILE="app-debug.apk"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $APK_FILE"

            echo "### 🚀 APK Download Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was successfully built and published to GitHub Releases:" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Filename**: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly from the **Assets** section of the release above." >> $GITHUB_STEP_SUMMARY
            echo "As a backup, the Actions artifact named \`app-debug-apk\` is also available on this workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::Release publishing failed or was skipped."
            echo "APK build succeeded, but release publishing encountered an issue."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            echo "### ⚠️ Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but publishing to GitHub Releases was not completed." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the built APK from the **Artifacts** section of this workflow run:" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
          fi
